# 🐳 Docker Compose para desarrollo local
version: '3.8'

services:
  # 🌐 Aplicación web
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY:-6LcyBKwrAAAAAN5VbS1ONFxLexh1-PzTm24RNmKj}
      - PORT=8000
    volumes:
      # 🔄 Montaje para desarrollo (comentar en producción)
      - .:/app
    restart: unless-stopped
    
  # 📊 Nginx para archivos estáticos (opcional para producción)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./css:/usr/share/nginx/html/css
      - ./js:/usr/share/nginx/html/js
      - ./sass:/usr/share/nginx/html/sass
      - ./IMAGEN.jpg:/usr/share/nginx/html/IMAGEN.jpg
      - ./favicon.svg:/usr/share/nginx/html/favicon.svg
    depends_on:
      - web
    restart: unless-stopped

# 🌐 Configuración de red
networks:
  default:
    name: portfolio-network
