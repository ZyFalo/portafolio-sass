# 🐳 Docker Compose para desarrollo local
version: '3.8'

services:
  # 🚀 Servicio principal del portfolio
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY:-6LeWRbwrAAAAAG9boVQpEj2Vgv7gE5FYGf5iqnxj}
    volumes:
      # 🔄 Para desarrollo: montar código fuente (opcional)
      - .:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# 🌐 Red personalizada (opcional)
networks:
  default:
    name: portfolio-network
